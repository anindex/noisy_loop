[project]
name = "noisy-loop"
version = "0.1.0"
description = "Continuous noisy-loop models: channel estimation and planar evidence queries"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "An T. Le", email = "an.thai.le97@gmail.com" }]
dependencies = ["numpy>=2.0", "scipy>=1.14"]

[project.urls]
Repository = "https://github.com/anindex/noisy_loop"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.10.9,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["examples/**", "tests/**", "docs/**", "experiments.py", "uv.lock"]
